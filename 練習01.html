<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>我是標題</title>
    </head>
    <body>
        <!-- 隱藏備註：Ctrl+ / -->
        <h1>我是文字大小</h1>
        <h3>Hello World</h3>
        <!-- 屬性標籤若不用包內容會直接在後面+ / -->
        <hr />
        <div></div>
        <img src="pic.png" alt="" />
        <ul>
            <li>
                <a
                    href="https://act.hoyolab.com/bbs/event/signin/hkrpg/index.html?act_id=e202303301540311&bbs_auth_required=true&bbs_presentation_style=fullscreen&lang=zh-tw&utm_source=share&utm_medium=link&utm_campaign=web"
                    >HSR</a
                >
            </li>
            <li>
                Monster Hunter
                <!-- li有順序跟前面點點 ol沒有順序 -->
                <ol>
                    Monster Hunter Wilds
                </ol>
                <ol>
                    Monster Hunter Now
                </ol>
            </li>
        </ul>
        <h2>HSR Docs</h2>
        <!-- html5中table已經不用border但依然可以使用 -->
        <table border="1" width="400" cellpadding="5">
            <tr>
                隊伍
                <td>流螢</td>
                <td>火</td>
                <td>擊破</td>
            </tr>
            <tr>
                屬性
                <td>黃泉</td>
                <td>雷</td>
                <td>掛負面</td>
            </tr>
            <tr>
                特色
                <td>遐蝶</td>
                <td>量子</td>
                <td>高生命</td>
            </tr>
        </table>
    </body>
</html>
